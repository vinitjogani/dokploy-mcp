# Deploy as a Dokploy "Compose" service from this repo, then in Dokploy:
#   Environment: the variables in .env.example (Dokploy writes them to .env next to this file).
#   Domains:     mcp.example.com -> service "gateway", port 80, HTTPS on. That one domain serves
#                the MCP and, with COMPOSE_PROFILES=registry, the container registry and its UI.
services:
  # The only service Traefik routes to (see gateway/40-gateway.sh for the routes).
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      REGISTRY_PROFILES: ${COMPOSE_PROFILES:-}
      # In the environment so that changing it recreates the gateway, which rehashes the logins.
      REGISTRY_USERS: ${REGISTRY_USERS:-}
    networks:
      - dokploy-network
      - mcp
      - registry
    security_opt:
      - no-new-privileges:true

  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    # dokploy-network: the Dokploy API is reachable on it as http://dokploy:3000, so API calls
    # never leave the host. Requests come in from the gateway over "mcp".
    networks:
      dokploy-network:
      mcp:
        aliases: [dokploy-mcp-app]  # unique: plain "mcp" may exist on other stacks' networks
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional container registry + web UI, off unless COMPOSE_PROFILES=registry (see README).
  # Both sit on a private network with no way out; the gateway checks every login.
  registry:
    image: registry:2
    profiles: [registry]
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HEALTH_STORAGEDRIVER_ENABLED: "false"
      REGISTRY_HTTP_RELATIVEURLS: "true"
      REGISTRY_HTTP_SECRET: ${REGISTRY_HTTP_SECRET:-}
    volumes:
      - registry-data:/var/lib/registry
    networks:
      registry:
        aliases: [dokploy-mcp-registry]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  registry-ui:
    image: joxit/docker-registry-ui:2.6.0
    profiles: [registry]
    restart: unless-stopped
    environment:
      REGISTRY_TITLE: ${REGISTRY_TITLE:-Registry}
      SINGLE_REGISTRY: "true"
      DELETE_IMAGES: "true"
    networks:
      registry:
        aliases: [dokploy-mcp-registry-ui]
    security_opt:
      - no-new-privileges:true

networks:
  dokploy-network:
    external: true
  mcp:
    internal: true
  registry:
    internal: true

volumes:
  data:
  registry-data:
